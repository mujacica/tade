<!--
  The shell. It is the whole of what an unauthenticated request can get, and it
  carries no data at all: no task, no project, no name, no count. Everything on
  the page arrives from a route that needs a session, which is what makes
  serving this to anybody who asks a safe thing to do — and it is why **the same
  bytes answer every screen's path**, so a deep link to a project that is not
  there, or that this device may not read, is not a way of finding out which.

  No inline script and no inline style, because the content policy has neither
  `unsafe-inline` nor `eval`. Every value reaches the DOM through `textContent`;
  nothing here or in the modules it pulls in touches `innerHTML`.

  The manifest and the two icons are what a phone reads to put this on a home
  screen. Both links are needed and neither is a duplicate of the other: the
  manifest's icons are what Android and desktop Chrome use, and Safari ignores
  them and reads `apple-touch-icon`, which is why there is a 180px PNG in the
  folder. `theme-color` is the system bar, and it is `--ground` so that an
  installed window has no light edge around a dark page. All of it is
  generated — `node packages/web/scripts/icons.ts` — so the mark is one
  drawing at four sizes rather than four drawings.

  There is no `apple-mobile-web-app-capable` and no status-bar style. Since
  iOS 26 every added site opens as a web app, 16.4 to 18 read the manifest's
  `display`, and the one thing the Apple meta would still buy —
  `black-translucent` — puts the header under the notch, because nothing here
  reads `safe-area-inset-top`. A tag that needs a layout nobody wrote is a tag
  that makes the page worse.

  `lang` is on the one element that can carry it: the page's text is English
  and a screen reader that has to guess reads it in whatever voice it was last
  set to.

  `<body>` is empty on purpose. `boot.js` decides which of two pages this is —
  pair this device, or the control room — and building the frame in script keeps
  one description of it instead of one here and one there that drift. What a
  person sees before the script runs is the one line below, which is replaced
  rather than hidden.
-->
<html lang="en">
  <title>Tade</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#121212" />
<link rel="manifest" href="/assets/tade.webmanifest" />
<link rel="icon" href="/assets/icon-192.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="stylesheet" href="/assets/tokens.css" />
<link rel="stylesheet" href="/assets/frame.css" />
<link rel="stylesheet" href="/assets/away.css" />
<main id="main">
  <p class="empty">Loading Tade…</p>
</main>
<script type="module" src="/assets/boot.js"></script>
</html>
