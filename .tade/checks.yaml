# What Tade checks itself with. `pnpm check` runs exactly these, in this order,
# and `.github/workflows/ci.yml` is generated from this file — so the gate on
# your machine and the gate in CI cannot drift apart without a test saying so.
#
# Edit here, then run `tade checks workflow --write`.
checks:
  - id: format
    title: Formatting and lint
    run: pnpm exec biome ci .
    minutes: 3
  - id: types
    title: Types
    run: pnpm exec tsc -p tsconfig.json
    minutes: 5
  - id: tests
    title: Tests
    run: pnpm exec vitest run
    # The suite spawns real git and PTY processes with short timeouts. Anything
    # CPU-heavy beside it starves them, and that looks exactly like a
    # regression and is not one: 13 such failures over 485s became 465 passing
    # in 8s once the suite had the machine to itself.
    alone: true
    minutes: 10
ci:
  runs_on: [ubuntu-latest, macos-latest]
  node: '22'
  setup:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    # The tmux driver's conformance suite is not one that may be skipped: a
    # driver nobody proved can drive a lane is a driver nobody should ship.
    # Ubuntu runners have tmux already; macOS runners have none, and without
    # this every tmux test went red there and read like a regression.
    - name: tmux
      run: |
        command -v tmux >/dev/null || if command -v brew >/dev/null; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
        tmux -V
