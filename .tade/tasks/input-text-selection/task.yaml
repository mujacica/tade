  prompt: >-
    Make the orchestrator's message input behave like a standard text editor for
    selection. Their words, verbatim:


    "For messages we are sending to Orchestrator, can we implement double click
    it to select all, or more clicks to select a specific word etc. as it works
    in standard text editors. Also when everything is selected clicking
    backspace or delete should remove the selection."


    What to build (packages/app: editor.ts, app.ts, keys.ts, ui.ts — a single
    click already moves the caret, which another agent added):

    - Multi-click selection: double click and triple click select, in the way
    standard editors do. Note their wording pairs double click with select-all
    and more clicks with a word, which is the opposite of the usual convention
    (double = word, triple = line/all). Build the standard convention, and say
    plainly in your final message that you did and why, so they can tell you to
    swap it — do not silently do neither.

    - Drag to extend a selection, and shift+click to extend from the caret.

    - Selection renders visibly (a selection background from the skin, not a
    hand-picked colour).

    - Backspace and delete remove the selection when there is one, rather than
    one character. Typing with a selection replaces it. Ctrl/Cmd+A selects
    everything.

    - Standard word motion while you are in there if it is cheap: ctrl/alt+arrow
    by word, shift+arrow to select.

    - Enter still sends, and sending must not move focus away — an earlier fix
    made focus stay on the orchestrator input; keep it.


    If the same input widget is used elsewhere (the file editor's inline
    editing, search fields), implement it in the widget so they all get it. Add
    tests for the selection model — it is pure logic and should not need a
    terminal. Pull/rebase first — several agents are reworking packages/app. Run
    `pnpm check` on its own and commit only your files.
  touches:
    - packages/app/src/editor.ts
    - packages/app/src/app.ts
    - packages/app/src/keys.ts
    - packages/app/src/ui.ts
title: Add standard text selection to orchestrator input
