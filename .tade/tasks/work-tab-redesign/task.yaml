  prompt: >-
    Rename and redesign the agent's "work" tab. Their words:


    "a) Why is this window called Work - let's call it Actions, Checks something
    that makes sense. b) Design is horrible - let's find a better way to present
    this information - and also showcase exactly which commits got produced by
    this agent and which not d) And once again more visual design please. Also
    sub-steps, what got ran, how many tests, which format checks which type
    checks etc. Make this page more useful"


    Today it is a bare stack of text: `branch main · 0 ahead · 25 uncommitted`,
    a COMMITS list of 30 subjects in which only one is this agent's (it says "1
    with this task's trailer" and then shows all thirty identically), and three
    lines `format / types / tests — not run`. Nothing is grouped, nothing is
    weighted, and the one thing you want — what did *this* agent do, and is it
    good — is the hardest thing to see.


    What to build (packages/app — the tab is beside `agent` in the agent pane;
    see panels.ts / panel-view.ts / view.ts):

    1. **Rename it.** `work` says nothing. Pick something that names what is on
    it once you have redesigned it — they suggested Actions or Checks. Whatever
    you choose, the tab, any keybinding hint and the golden screens must agree.

    2. **This agent's commits, unmistakably.** Commits carrying this task's
    `Tade-Task:` trailer are the agent's own and must be visually separated from
    everybody else's — not mixed into one list with a count in the header. Show
    each with what it touched (files, +/-), and make it clear when the agent has
    uncommitted work outstanding. `25 uncommitted` in a shared checkout is
    mostly other agents' work: say whose is whose, or say plainly that it cannot
    tell.

    3. **Checks, in useful detail.** Not three words. Per check: what command
    ran, when, against which commit, how long it took, and its result broken
    down — how many tests passed/failed/skipped, which files the formatter would
    change, how many type errors and where. Sub-steps where a check has them. A
    failing check should get you to the failing tail without leaving the page.

    4. **Make it look designed**: grouping, headings, weight, spacing —
    consistent with the palette and chrome the other agents have been fixing.


    An agent on tade/checks-survive-commit is fixing the underlying bug that
    made all three read `not run` right after a commit — pull/rebase and show
    whatever richer record it lands rather than inventing your own. Keep the
    invariant visible: a check nobody ran is `unknown`, not fine. Add golden
    screen coverage: an agent with own commits and passing checks, one with a
    failure, one with nothing yet. Pull/rebase first — several agents are
    reworking packages/app. Run `pnpm check` on its own and commit only your
    files.
  touches:
    - packages/app/src/panels.ts
    - packages/app/src/panel-view.ts
    - packages/app/src/view.ts
