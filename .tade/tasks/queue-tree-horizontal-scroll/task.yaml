  prompt: >-
    The Smart Queue tree in the sidebar renders wrongly once a chain gets deep.
    Their words: "when there are too many stacked tasks in the queue we render
    it wrongly. Instead of cutting it let's make the left pane horizontally
    scrollable where it makes sense. The same column should mean the
    same/parallel priority."


    From their screenshot: a five-deep chain in the sidebar, each level indented
    further right, so by the fourth and fifth the task names are clipped
    mid-word (`keycaps-and-row-mark…`, `after keycaps-and-…`) and the tree runs
    out of pane. Indenting per depth cannot survive a long chain in a narrow
    pane.


    What to build (packages/app: panels.ts, panel-view.ts, plan-graph.ts,
    queue.ts, ui.ts):

    1. Make the left pane horizontally scrollable where that makes sense, rather
    than clipping: a horizontal scrollbar matching the vertical one another
    agent just made a single continuous thumb, draggable, and
    keyboard/scroll-wheel horizontal movement. Only where it earns its place —
    do not put one on panes that never overflow.

    2. **A column means a priority.** Tasks in the same column are the same
    depth in the resolved tree — things that can run in parallel line up
    vertically with each other. So lay the tree out by resolved depth, not by
    cumulative indent per row, and keep that property when the chain is long.

    3. Nothing clipped mid-word without a clear ellipsis, and the `after …`
    reason line must stay legible.


    The agent on tade/why-it-waits-readable is reworking the same tree drawing
    just before you — pull/rebase and build on what it landed, do not draw a
    third version of this. Add golden screen coverage for a deep chain in a
    narrow sidebar. Run `pnpm check` on its own and commit only your files.
  touches:
    - packages/app/src/panels.ts
    - packages/app/src/panel-view.ts
    - packages/app/src/plan-graph.ts
    - packages/app/src/queue.ts
    - packages/app/src/ui.ts
title: Scroll deep queue tree horizontally instead of truncating
