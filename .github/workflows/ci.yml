# .github/workflows/ci.yml — generated by `tade checks workflow --write`; edit .tade/checks.yaml

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: the branch's old run is not news, and a
# run that keeps going spends minutes on a commit nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: format
        run: pnpm exec biome ci .
      - name: types
        run: pnpm exec tsc -p tsconfig.json
      - name: tests
        run: pnpm exec vitest run
