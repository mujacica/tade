# The gate every change goes through, and the one place it is written down.
#
# Not generated any more, and nothing generates anything from it: Tade reads
# this file to know what this project checks — the steps of a job in a workflow
# triggered by a change, which is what a gate is — so what runs here and what
# `checks_run` runs on somebody's laptop are the same commands by construction
# rather than by a test holding two files in step.
#
# Two consequences worth knowing before editing it:
#
#   * A step's `name:` is the check's id. `format`, `types` and `tests` are what
#     the window draws, what `checks_run format` takes and what every run in
#     `.tade/checks.jsonl` is recorded under. Renaming one does not orphan its
#     history — a run remembers the command it ran, and Tade reads it back onto
#     the step that still runs it — but the id people type does change, so
#     rename deliberately.
#   * A step that only CI can run is read as one and named rather than run:
#     anything with `${{ }}` in it, anything needing a secret or a service, and
#     the install steps, which prepare the machine rather than check the code.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So another workflow can run this exact gate instead of keeping a second
  # copy of it. A release does: nothing is published until this has passed.
  workflow_call:

# A second push supersedes the first: the branch's old run is not news, and a
# run that keeps going spends minutes on a commit nobody has any more.
#
# Keyed by the workflow as well as the ref, because a workflow that calls this
# one runs it under the caller's ref: sharing a group with the branch's own run
# would mean a release cancelling the CI beside it, or being cancelled by it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # Otherwise half the matrix is cancelled the moment one row goes red, and
      # the window shows a column of nothing where the other OS should be.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tmux driver's conformance suite is not one that may be skipped: a
      # driver nobody proved can drive a lane is a driver nobody should ship.
      # Ubuntu runners have tmux already; macOS runners have none, and without
      # this every tmux test went red there and read like a regression.
      - name: tmux
        run: |
          command -v tmux >/dev/null || if command -v brew >/dev/null; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          tmux -V
      - name: format
        run: pnpm exec biome ci .
      - name: types
        run: pnpm exec tsc -p tsconfig.json
      # The suite, and then the coverage floors — `scripts/coverage.ts` runs
      # vitest and holds what it measured to a floor per package. Measuring
      # costs nothing worth naming (111.6s against 111.8s), so there is no
      # version of the suite that is the one where we also look.
      #
      # It gets the machine to itself here because a CI step always does, and
      # for the same reason `checks_run` gives it the machine locally: the
      # tests spawn real git and PTY processes with short timeouts, and
      # anything CPU-heavy beside them starves them into what looks exactly
      # like a regression and is not one.
      - name: tests
        run: pnpm exec node scripts/coverage.ts
