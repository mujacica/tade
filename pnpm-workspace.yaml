packages:
  - packages/*
  - packages/*/*
  - test
# Which dependencies may run their install scripts, and the only place that
# says so: pnpm 12 reads nothing of this from package.json. None may: Tade
# needs nothing built. Its two native modules arrive ready-built —
# `@lydell/node-pty` is node-pty's prebuilds in one package per platform, with
# no install script and `spawn-helper` packed executable, and better-sqlite3
# 13.x ships an N-API binding per platform in `prebuilds/` and sets `gypfile:
# false`, so not even the implicit `node-gyp rebuild` applies (measured,
# 13.0.3 on Node 26, 2026-10-19; `test/install.test.ts` holds both). The rest
# have scripts Tade does not need, and work without theirs.
allowBuilds:
  '@google/genai': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false
